# 로컬 개발용 프로파일 (MySQL 없이 H2 인메모리 DB로 구동)
# 실행: ./gradlew bootRun --args='--spring.profiles.active=local'
spring:
  thymeleaf:
    cache: false
  datasource:
    url: jdbc:h2:mem:localpaymap;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

open-data:
  sync-cron: "0 0 0 31 2 *" # 로컬에서는 배치 자동 실행 안 되도록 매년 2/31(존재하지 않는 날짜)로 비활성화
  sync-on-startup: false # 로컬 기동 시 외부 공공데이터 API 호출 안 함 (필요하면 관리자 페이지에서 수동 동기화/파일 업로드)

logging:
  level:
    com.localpaymap: debug
