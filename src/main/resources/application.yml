server:
  port: ${PORT:8080}
  # PaaS의 리버스 프록시(HTTPS 종단) 뒤에서 X-Forwarded-* 헤더를 신뢰
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: localpaymap
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:localpaymap}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:localpaymap}
    password: ${DB_PASSWORD:localpaymap}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# 네이버 클라우드 플랫폼(https://console.ncloud.com) Maps 서비스에서 발급받은 키
naver:
  client-id: ${NAVER_CLIENT_ID:}
  client-secret: ${NAVER_CLIENT_SECRET:}
  geocode-base-url: ${NAVER_GEOCODE_BASE_URL:https://maps.apigw.ntruss.com/map-geocode/v2}

# 공공데이터포털(https://www.data.go.kr/data/15100062/standard.do) 활용신청 후 발급받은 서비스키
open-data:
  base-url: ${OPEN_DATA_BASE_URL:http://api.data.go.kr/openapi/tn_pubr_public_local_bill_api}
  service-key: ${OPEN_DATA_SERVICE_KEY:}
  sync-cron: ${OPEN_DATA_SYNC_CRON:0 0 4 * * *}
  # 서버 최초 기동 시(OPEN_API 가맹점이 하나도 없을 때) 새벽 스케줄을 기다리지 않고 즉시 1회 동기화
  sync-on-startup: ${OPEN_DATA_SYNC_ON_STARTUP:true}

# 최초 기동 시 관리자 계정이 없으면 자동 생성됨. 운영 배포 전 반드시 변경할 것.
admin:
  default-username: ${ADMIN_DEFAULT_USERNAME:admin}
  default-password: ${ADMIN_DEFAULT_PASSWORD:changeme123!}

logging:
  level:
    com.localpaymap: ${LOG_LEVEL:info}
