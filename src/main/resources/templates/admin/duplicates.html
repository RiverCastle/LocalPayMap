<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>중복 가맹점 관리 - 지역화폐 가맹점 지도</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
    <header class="app-header">
        <h1>중복 가맹점 관리</h1>
        <div>
            <a class="admin-link" th:href="@{/admin/stores}">가맹점 관리</a>
            <a class="admin-link" th:href="@{/}">지도로 이동</a>
            <form th:action="@{/admin/logout}" method="post" style="display:inline">
                <button type="submit" class="admin-link" style="background:none;cursor:pointer">로그아웃</button>
            </form>
        </div>
    </header>

    <div class="admin-container">
        <section>
            <h2>중복 가맹점 목록</h2>
            <p style="font-size:13px;color:#666">
                지역화폐·가맹점명·도로명주소가 모두 같은 가맹점을 묶어서 보여줍니다.
                그룹마다 가장 먼저 등록된 1건만 남기고 나머지가 기본 선택되어 있습니다. 확인 후 선택한 항목을 삭제하세요.
            </p>
            <div>
                <span id="dupSummary"></span>
                <button id="autoSelectAll" type="button">기본 선택으로 되돌리기(그룹당 1건 유지)</button>
                <button id="deleteSelected" type="button">선택 항목 삭제</button>
                <span id="dupStatus"></span>
            </div>
            <div style="margin:8px 0">
                <button id="deleteAllButton" type="button">전체 중복 일괄 삭제...</button>
            </div>
            <div id="bulkPanel" hidden style="border:2px solid #c0392b;padding:12px;margin:12px 0;background:#fff7f6">
                <h3 style="margin:0 0 8px">전체 중복 일괄 삭제 확인</h3>
                <table id="bulkSummary" style="width:auto"></table>
                <p style="font-size:13px;color:#c0392b">
                    페이지·선택과 관계없이 모든 중복 그룹에서 가장 먼저 등록된 1건만 남기고 삭제합니다. 삭제 후에는 되돌릴 수 없습니다.
                </p>
                <button id="bulkConfirm" type="button">위 내용을 확인했으며 삭제 실행</button>
                <button id="bulkCancel" type="button">취소</button>
                <span id="bulkStatus"></span>
            </div>
            <div id="dupGroups"></div>
            <div style="margin-top:12px">
                <button id="prevPage" type="button">이전</button>
                <span id="pageInfo"></span>
                <button id="nextPage" type="button">다음</button>
            </div>
        </section>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        window.CSRF_HEADER_NAME = 'X-XSRF-TOKEN';
        /*]]>*/
    </script>
    <script th:src="@{/js/admin-duplicates.js}"></script>
</body>
</html>
