<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>지역화폐 가맹점 지도</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="map-page">
    <header class="app-header">
        <h1>지역화폐 가맹점 지도</h1>
        <div class="header-actions">
            <span id="authArea" class="auth-area"></span>
            <a class="admin-link" th:href="@{/admin/stores}">관리자</a>
        </div>
    </header>

    <section class="filter-bar">
        <select id="currencyTypeSelect">
            <option value="">전체 지역화폐</option>
        </select>
        <div class="category-search">
            <input id="categoryInput" type="text" placeholder="세부 업종 검색 (예: 치과)" autocomplete="off" />
            <ul id="categorySuggestions" class="category-suggestions hidden"></ul>
        </div>
        <input id="keywordInput" type="text" placeholder="가맹점명 검색" />
        <button id="searchButton" type="button">검색</button>
        <button id="filterToggle" type="button" class="filter-toggle" aria-expanded="false" aria-label="필터 열기">필터</button>
        <button id="locateButton" type="button">내 주변 가맹점</button>
        <button id="favoritePanelButton" type="button" class="favorite-panel-btn">★ 내 즐겨찾기</button>
    </section>

    <section id="categoryChips" class="category-chips" aria-label="업종 필터"></section>

    <main>
        <div id="map"></div>
        <button id="locateFab" type="button" class="locate-fab" aria-label="내 주변 가맹점">&#9737;</button>
        <aside id="listPanel" class="list-panel">
            <div id="sheetHandle" class="sheet-handle" role="button" tabindex="0" aria-label="가맹점 목록 펼치기/접기">
                <span class="sheet-grip"></span>
                <span id="sheetSummary" class="sheet-summary">가맹점 목록</span>
            </div>
            <div id="storeList" aria-label="가맹점 목록"></div>
        </aside>
    </main>

    <aside id="favoritePanel" class="favorite-panel hidden" aria-label="내 즐겨찾기 그룹">
        <button id="closeFavoritePanel" type="button" class="close-btn" aria-label="닫기">&times;</button>
        <h2>내 즐겨찾기</h2>
        <div id="favoriteFilterStatus" class="fav-filter-status hidden">
            <span id="favoriteFilterText"></span>
            <button id="clearFavoriteFilter" type="button" class="fav-link">전체 보기</button>
        </div>
        <div id="favoriteGroupList"></div>
        <div class="fav-new-group">
            <input id="newGroupName" type="text" maxlength="50" placeholder="새 그룹 이름" />
            <button id="addGroupButton" type="button">그룹 만들기</button>
        </div>
    </aside>

    <div id="storeDetail" class="store-detail hidden">
        <button id="closeDetailButton" type="button" class="close-btn">&times;</button>
        <h2 id="detailName"></h2>
        <p id="detailAddress"></p>
        <p id="detailPhone"></p>
        <p id="detailCategory"></p>
        <p id="detailCurrency"></p>
        <div id="detailGroups" class="detail-groups"></div>
        <a id="detailNaverLink" href="#" target="_blank" rel="noopener">네이버 지도에서 보기</a>
    </div>

    <script th:src="|https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${naverClientId}|"></script>
    <script th:src="@{/js/auth.js}"></script>
    <script th:src="@{/js/favorites.js}"></script>
    <script th:src="@{/js/map.js}"></script>
</body>
</html>
